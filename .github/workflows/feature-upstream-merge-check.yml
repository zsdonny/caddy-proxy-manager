name: Feature/Fix Branch — Upstream Merge Check

# Checks every feature/* and fix/* branch against fuomag9/caddy-proxy-manager@develop.
# Each branch gets its own parallel job card in the Actions UI (✅ clean / ❌ conflict).
# Adding or removing a feature/* or fix/* branch automatically adjusts the matrix next run.
#
# Job flow:  enumerate  →  check (dynamic matrix, one job per branch)  →  report
#
# ● Each check job writes a mini summary showing which files conflict (if any)
# ● report job writes the aggregate summary table + Copilot Analysis
# ● Silent Pushover notification (priority=-1) sent ONLY when ≥1 conflict found
# ● GitHub Models gpt-4o-mini (free tier — no Copilot Pro quota consumed) classifies each
#   conflicting file as FORK-EXCLUSIVE (expected divergence) vs GENUINE CLASH (needs resolution)
#
# Requires Git 2.38+ for `git merge-tree --write-tree` (ubuntu-latest ships Git 2.43+)

on:
  schedule:
    - cron: '0 7 * * *'  # Daily at 07:00 UTC
  workflow_dispatch:

env:
  UPSTREAM_REPO: fuomag9/caddy-proxy-manager
  UPSTREAM_BRANCH: develop

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Enumerate feature/* and fix/* branches → JSON array output
  # ─────────────────────────────────────────────────────────────────
  enumerate:
    name: Enumerate branches
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      branches: ${{ steps.list.outputs.branches }}
      count: ${{ steps.list.outputs.count }}

    steps:
      - name: List feature/* and fix/* branches
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCHES_JSON=$(gh api "repos/${{ github.repository }}/branches" \
            --paginate \
            --jq '[.[].name | select(test("^(feature|fix)/"))] | sort' \
            2>/dev/null || echo "[]")

          COUNT=$(echo "$BRANCHES_JSON" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            echo "::notice::No feature/* or fix/* branches found — nothing to check."
          fi

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "branches=$BRANCHES_JSON" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────
  # Job 2: One matrix job per branch — runs in parallel
  #         Job name = branch name; exits 1 on conflict (red ✗ in UI)
  # ─────────────────────────────────────────────────────────────────
  check:
    name: ${{ matrix.branch }}
    needs: enumerate
    if: needs.enumerate.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false   # one conflict doesn't cancel sibling branch checks
      matrix:
        branch: ${{ fromJson(needs.enumerate.outputs.branches) }}

    steps:
      - name: Checkout repository (full history + all origin refs)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add upstream remote and fetch upstream/${{ env.UPSTREAM_BRANCH }}
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}" --no-tags --quiet

      - name: Check ${{ matrix.branch }} against upstream/${{ env.UPSTREAM_BRANCH }}
        id: merge
        run: |
          BRANCH="${{ matrix.branch }}"

          # fetch-depth:0 already pulled all origin/* refs; ensure this specific one is present
          git fetch origin "${BRANCH}:refs/remotes/origin/${BRANCH}" \
            --no-tags --quiet 2>/dev/null || true

          # Dry-run 3-way merge — no workspace changes
          set +e
          MERGE_OUTPUT=$(git merge-tree --write-tree \
            "refs/remotes/origin/${BRANCH}" \
            "refs/remotes/upstream/${UPSTREAM_BRANCH}" 2>&1)
          MERGE_EXIT=$?
          set -e

          if [ "$MERGE_EXIT" -eq 0 ]; then
            STATUS="clean"
            CONFLICT_FILES="[]"
          else
            STATUS="conflict"
            # Extract conflicting file paths — covers content, add/add, modify/delete types
            CONFLICT_FILES=$(echo "$MERGE_OUTPUT" \
              | awk '
                  /^CONFLICT/ && /Merge conflict in/ { print $NF }
                  /^CONFLICT \(modify\/delete\)/     { print $3 }
                  /^CONFLICT \(delete\/modify\)/     { print $3 }
                ' \
              | sort -u \
              | (jq -R . | jq -s . 2>/dev/null || echo "[]"))
            [ -z "$CONFLICT_FILES" ] && CONFLICT_FILES="[]"
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          # Write result.json for aggregation in the report job
          SAFE_BRANCH="${BRANCH//\//-}"
          mkdir -p /tmp/result
          jq -n \
            --arg b  "$BRANCH" \
            --arg s  "$STATUS" \
            --argjson c "$CONFLICT_FILES" \
            '{"branch": $b, "status": $s, "conflicts": $c}' \
            > /tmp/result/result.json

          echo "result_dir=/tmp/result" >> "$GITHUB_OUTPUT"
          echo "safe_branch=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Write per-branch step summary
        if: always()
        run: |
          BRANCH="${{ matrix.branch }}"
          STATUS="${{ steps.merge.outputs.status }}"
          {
            if [ "$STATUS" = "clean" ]; then
              echo "## ✅ \`${BRANCH}\` — merges cleanly into \`upstream/${UPSTREAM_BRANCH}\`"
            else
              echo "## ❌ \`${BRANCH}\` — conflicts with \`upstream/${UPSTREAM_BRANCH}\`"
              echo ""
              echo "**Conflicting files:**"
              echo ""
              jq -r '.conflicts[] | "- `\(.)`"' /tmp/result/result.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ steps.merge.outputs.safe_branch }}
          path: /tmp/result/result.json
          retention-days: 1
          if-no-files-found: warn

      - name: Fail job on conflict (sets red ✗ in Actions UI)
        if: steps.merge.outputs.status == 'conflict'
        run: |
          echo "::error::Branch '${{ matrix.branch }}' has merge conflicts with upstream/${UPSTREAM_BRANCH}."
          exit 1

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Aggregate results → summary table + AI analysis + Pushover
  # ─────────────────────────────────────────────────────────────────
  report:
    name: Report
    needs: [enumerate, check]
    if: always() && needs.enumerate.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read

    steps:
      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: false

      - name: Aggregate branch results
        id: aggregate
        run: |
          # Each artifact lands at results/result-<safe-branch>/result.json
          RESULTS_FILE="/tmp/merge-results.json"
          find results -name result.json \
            | sort \
            | xargs jq -s '.' \
            > "$RESULTS_FILE"

          CONFLICT_COUNT=$(jq '[.[] | select(.status == "conflict")] | length' "$RESULTS_FILE")
          CLEAN_COUNT=$(jq '[.[] | select(.status == "clean")] | length' "$RESULTS_FILE")
          TOTAL=$(jq 'length' "$RESULTS_FILE")

          echo "conflict_count=$CONFLICT_COUNT" >> "$GITHUB_OUTPUT"
          echo "clean_count=$CLEAN_COUNT" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Classify conflicts with GitHub Models (gpt-4o-mini — free tier)
        id: ai
        if: steps.aggregate.outputs.conflict_count != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RESULTS=$(cat /tmp/merge-results.json)

          PAYLOAD=$(jq -n \
            --arg results "$RESULTS" \
            '{
              "model": "gpt-4o-mini",
              "messages": [
                {
                  "role": "system",
                  "content": "You are a fork-maintenance assistant. The user maintains a fork (zsdonny/caddy-proxy-manager) of upstream (fuomag9/caddy-proxy-manager). The fork adds features absent in upstream: WAF geo-blocking, mTLS client certificates, analytics dashboard, L4 UDP routing improvements, and OAuth account linking. Fork-specific files include: app/(dashboard)/analytics/, src/lib/caddy-waf.ts, src/lib/acme-certs.ts, src/lib/caddy-mtls.ts, and drizzle migration files numbered 0010 and above.\n\nFor each conflicting file, classify it as:\n- FORK-EXCLUSIVE — only exists in the fork or was introduced by a fork-only feature. Expected divergence; not a blocker for upstreaming other changes.\n- GENUINE CLASH — both the fork branch and upstream independently modified the same shared file. Must be manually resolved before the branch can be submitted upstream.\n\nBe concise: 1–2 sentences per file. End with a one-sentence action summary."
                },
                {
                  "role": "user",
                  "content": ("Classify the conflicting files for each branch as FORK-EXCLUSIVE or GENUINE CLASH and briefly explain why:\n\n" + $results)
                }
              ],
              "max_tokens": 800,
              "temperature": 0.2
            }')

          RESPONSE=$(curl -s --fail-with-body \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            https://models.inference.ai.azure.com/chat/completions)

          printf '%s\n' "$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "AI analysis unavailable."')" \
            > /tmp/ai-analysis.txt

      - name: Write aggregate step summary
        if: always()
        run: |
          TOTAL="${{ steps.aggregate.outputs.total }}"
          CONFLICT_COUNT="${{ steps.aggregate.outputs.conflict_count }}"
          CLEAN_COUNT="${{ steps.aggregate.outputs.clean_count }}"

          {
            echo "## Feature/Fix Branch — Upstream Merge Check"
            echo ""
            echo "**Upstream:** \`fuomag9/caddy-proxy-manager @ develop\`  |  **$(date -u '+%Y-%m-%d %H:%M UTC')**"
            echo ""

            if [ ! -f /tmp/merge-results.json ] || [ "${TOTAL:-0}" -eq 0 ]; then
              echo "_No \`feature/*\` or \`fix/*\` branches found._"
            else
              echo "| Branch | Status | Conflicting Files |"
              echo "|--------|--------|-------------------|"
              jq -r '.[] | [
                .branch,
                .status,
                (.conflicts | if length == 0 then "—" else map("`\(.)`") | join(", ") end)
              ] | @tsv' /tmp/merge-results.json \
              | while IFS=$'\t' read -r BRANCH STATUS FILES; do
                  if [ "$STATUS" = "clean" ]; then ICON="✅ Clean"; else ICON="❌ Conflicts"; fi
                  echo "| \`${BRANCH}\` | ${ICON} | ${FILES} |"
                done
              echo ""
              echo "**${CLEAN_COUNT:-0}/${TOTAL} branches merge cleanly into upstream. ${CONFLICT_COUNT:-0} need attention.**"

              if [ -f /tmp/ai-analysis.txt ] && [ -s /tmp/ai-analysis.txt ]; then
                echo ""
                echo "---"
                echo ""
                echo "### Copilot Analysis"
                echo ""
                cat /tmp/ai-analysis.txt
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send silent notification (conflicts only)
        if: steps.aggregate.outputs.conflict_count != '0'
        run: |
          CONFLICT_COUNT="${{ steps.aggregate.outputs.conflict_count }}"
          TOTAL="${{ steps.aggregate.outputs.total }}"
          CONFLICT_BRANCHES=$(jq -r \
            '[.[] | select(.status == "conflict") | .branch] | join(", ")' \
            /tmp/merge-results.json)
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s --fail-with-body \
            --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=Feature branch merge check — conflicts found" \
            --form-string "message=${CONFLICT_COUNT}/${TOTAL} branches conflict with upstream/develop: ${CONFLICT_BRANCHES}" \
            --form-string "url=${RUN_URL}" \
            --form-string "url_title=View full report" \
            --form-string "priority=-1" \
            https://api.pushover.net/1/messages.json
