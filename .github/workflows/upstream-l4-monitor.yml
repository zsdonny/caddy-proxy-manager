name: Monitor Upstream L4 Port Manager

# Runs daily to detect upstream changes to docker/l4-port-manager/ and send alerts.
# Stores the last-seen upstream SHA in .upstream-sha for change detection (commit does NOT
# trigger a build — .upstream-sha is excluded from docker-build-l4-port-manager.yml's path filter).
#
# Alerts are sent when:
# 1. Upstream commits to docker/l4-port-manager/ (review + rebuild manually if needed)
# 2. Upstream ships their own l4-port-manager build workflow (fork build may become redundant)

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test alert (skips upstream checks)'
        type: boolean
        default: false

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get upstream latest l4-port-manager commit SHA
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh api \
            "repos/fuomag9/caddy-proxy-manager/commits?path=docker/l4-port-manager&per_page=1" \
            --jq '.[0].sha' 2>/dev/null || echo "")
          if [ -z "$SHA" ]; then
            echo "::warning::Could not fetch upstream SHA — API may be unavailable"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Read stored upstream SHA
        id: stored
        run: |
          FILE="docker/l4-port-manager/.upstream-sha"
          if [ -f "$FILE" ]; then
            echo "sha=$(cat "$FILE")" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync upstream SHA (change detection only — does not trigger build)
        id: synced
        if: >
          steps.upstream.outputs.sha != '' &&
          steps.upstream.outputs.sha != steps.stored.outputs.sha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${{ steps.upstream.outputs.sha }}" > docker/l4-port-manager/.upstream-sha
          git add docker/l4-port-manager/.upstream-sha
          git commit -m "chore: track upstream l4-port-manager @ ${{ steps.upstream.outputs.sha }}"
          git push
          # Only alert on real changes — skip on first bootstrap (no stored SHA yet)
          if [ -n "${{ steps.stored.outputs.sha }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::First run — bootstrapped upstream SHA. No alert sent."
          fi

      - name: Send alert when upstream l4-port-manager code changes
        if: steps.synced.outputs.changed == 'true'
        run: |
          curl -s --fail-with-body \
            --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=Upstream l4-port-manager updated" \
            --form-string "message=fuomag9/caddy-proxy-manager pushed changes to docker/l4-port-manager/. Review and rebuild manually if needed." \
            --form-string "url=https://github.com/fuomag9/caddy-proxy-manager/commits/develop/docker/l4-port-manager" \
            --form-string "url_title=View upstream changes" \
            --form-string "priority=0" \
            https://api.pushover.net/1/messages.json

      - name: Check if upstream has added an l4-port-manager build workflow
        id: upstream-workflow-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FOUND=$(gh api repos/fuomag9/caddy-proxy-manager/contents/.github/workflows \
            --jq '[.[].name | select(test("l4"; "i"))] | length > 0' 2>/dev/null || echo "false")
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Send alert if upstream now builds l4-port-manager
        if: steps.upstream-workflow-check.outputs.found == 'true' || inputs.test_alert == true
        run: |
          curl -s --fail-with-body \
            --form-string "token=${{ secrets.PUSHOVER_APP_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "title=Upstream l4-port-manager detected" \
            --form-string "message=fuomag9/caddy-proxy-manager now has an l4-port-manager build workflow. Your fork's build may be redundant — check and consider retiring docker-build-l4-port-manager.yml." \
            --form-string "url=https://github.com/fuomag9/caddy-proxy-manager/tree/main/.github/workflows" \
            --form-string "url_title=View upstream workflows" \
            --form-string "priority=1" \
            https://api.pushover.net/1/messages.json
