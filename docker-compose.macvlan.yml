# =============================================================================
# Macvlan mode — standalone compose file for Portainer and CLI use
# =============================================================================
#
# USE THIS FILE when you want zero-downtime L4 port changes.
# Caddy gets its own LAN IP via macvlan — no Docker port mappings needed.
# L4 port changes become instant Caddy config reloads (no container restart).
#
# Portainer: paste this file into the stack editor instead of docker-compose.yml
# CLI:       docker compose -f docker-compose.macvlan.yml up -d
#
# REQUIRED env vars (set in Portainer environment or .env):
#   SESSION_SECRET      - generate: openssl rand -base64 32
#   ADMIN_USERNAME      - login username
#   ADMIN_PASSWORD      - login password (12+ chars, upper/lower/number/special)
#   MACVLAN_PARENT      - host NIC the macvlan attaches to (e.g. ens3, eth0)
#   MACVLAN_SUBNET      - your LAN subnet (e.g. 192.168.1.0/24)
#   MACVLAN_GATEWAY     - your LAN gateway (e.g. 192.168.1.1)
#   MACVLAN_IP_RANGE    - IP range to assign from (e.g. 192.168.1.200/30)
#   CADDY_MACVLAN_IP    - static IP for Caddy on LAN (e.g. 192.168.1.200)
#
# NOTE: Host cannot reach the macvlan IP directly. Use a macvlan shim if needed.
# NOTE: The l4-port-manager sidecar is not included — macvlan mode does not need it.
# =============================================================================

services:
  web:
    container_name: caddy-proxy-manager-web
    image: ghcr.io/fuomag9/caddy-proxy-manager-web:latest
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        PUID: ${PUID:-10001}
        PGID: ${PGID:-10001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?ERROR - SESSION_SECRET is required}
      CADDY_API_URL: ${CADDY_API_URL:-http://caddy:2019}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      DATABASE_PATH: /app/data/caddy-proxy-manager.db
      DATABASE_URL: file:/app/data/caddy-proxy-manager.db
      NEXTAUTH_URL: ${BASE_URL:-http://localhost:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ERROR - ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ERROR - ADMIN_PASSWORD is required}
      OAUTH_ENABLED: ${OAUTH_ENABLED:-false}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME:-OAuth2}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-}
      OAUTH_AUTHORIZATION_URL: ${OAUTH_AUTHORIZATION_URL:-}
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:-}
      OAUTH_USERINFO_URL: ${OAUTH_USERINFO_URL:-}
      OAUTH_ALLOW_AUTO_LINKING: ${OAUTH_ALLOW_AUTO_LINKING:-false}
      # Macvlan mode — L4 port changes are instant via Caddy config reload
      CADDY_NETWORK_MODE: macvlan
    group_add:
      - "${CADDY_GID:-10000}"
    volumes:
      - caddy-manager-data:/app/data
      - geoip-data:/usr/share/GeoIP:ro,z
      - caddy-logs:/logs:ro
      - caddy-data:/caddy-data:ro
    depends_on:
      caddy:
        condition: service_healthy
    networks:
      - caddy-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>{process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.2'
          memory: 5g

  caddy:
    container_name: caddy-proxy-manager-caddy
    image: ghcr.io/fuomag9/caddy-proxy-manager-caddy:latest
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
      args:
        PUID: ${PUID:-10000}
        PGID: ${PGID:-10000}
    restart: unless-stopped
    # No ports: — caddy binds directly via macvlan IP, no host port mapping needed.
    # All ports (80, 443, L4) are accessible at CADDY_MACVLAN_IP on your LAN.
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-caddyproxymanager.com}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/logs
      - geoip-data:/usr/share/GeoIP:ro,z
    networks:
      caddy-network: {}
      caddy-macvlan:
        ipv4_address: ${CADDY_MACVLAN_IP:?ERROR - CADDY_MACVLAN_IP is required in macvlan mode}
    healthcheck:
      # Try localhost first (works before web app configures Caddy),
      # then fall back to each container IP (works after admin is rebound to bridge IP).
      test: ["CMD", "sh", "-c", "for ip in localhost $(hostname -i); do wget -qO /dev/null http://$ip:2019/config/ 2>/dev/null && exit 0; done; exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 3g

  # l4-port-manager is intentionally absent in macvlan mode.
  # L4 port changes are handled by Caddy config reload — no container recreation needed.

  geoipupdate:
    container_name: geoipupdate-${HOSTNAME}
    image: ghcr.io/maxmind/geoipupdate
    profiles: [geoipupdate]
    restart: always
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID:-}
      - GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY:-}
      - 'GEOIPUPDATE_EDITION_IDS=GeoLite2-ASN GeoLite2-City GeoLite2-Country'
      - GEOIPUPDATE_FREQUENCY=72
    volumes:
      - geoip-data:/usr/share/GeoIP:z
    networks:
      - caddy-network

networks:
  caddy-network:
    driver: bridge
  caddy-macvlan:
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT:?ERROR - MACVLAN_PARENT is required (e.g. ens3, eth0)}
    ipam:
      config:
        - subnet: ${MACVLAN_SUBNET:?ERROR - MACVLAN_SUBNET is required (e.g. 192.168.1.0/24)}
          gateway: ${MACVLAN_GATEWAY:?ERROR - MACVLAN_GATEWAY is required (e.g. 192.168.1.1)}
          ip_range: ${MACVLAN_IP_RANGE:?ERROR - MACVLAN_IP_RANGE is required (e.g. 192.168.1.200/30)}

volumes:
  caddy-manager-data:
  caddy-data:
  caddy-config:
  caddy-logs:
  geoip-data:
